[project]
name = "robocon-legged-map"
version = "0.1.0"
description = "MuJoCo simulation and GLIM localization integration for ROBOCON S-Dog"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mujoco>=3.2,<4",
    "numpy>=1.26,<3",
    "pillow>=10,<13",
    "scipy>=1.13,<2",
    "torch>=2.5,<3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
